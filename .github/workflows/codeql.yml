name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly Mondays at 06:00 UTC — independent of push activity so the
    # badge stays current even when the repo is quiet.
    - cron: '0 6 * * 1'

# Least-privilege default; the analyze job widens this for SARIF upload.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Saxon-JS is a vendored third-party engine — out of scope for findings on our code.
          # tests/ is Playwright harness code, not shipped to users.
          config: |
            paths-ignore:
              - lib/SaxonJS2.js
              - tests/**
              - dist/**

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          category: "/language:${{ matrix.language }}"
